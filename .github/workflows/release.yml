# Builds aval for every platform and publishes a GitHub release — only for a
# version tag (v*) or a manual run, and only after the owner approves the
# "release" environment. No rolling releases on push: a push to main runs ci.yml
# and nothing else. Binaries ship with SHA256SUMS and a build-provenance
# attestation (`gh attestation verify <file> --repo alvaroofernaandez/aval`).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.2.0"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: darwin, arch: amd64 }
          - { os: darwin, arch: arm64 }
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
          - { os: windows, arch: amd64, ext: ".exe" }
          - { os: windows, arch: arm64, ext: ".exe" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # git describe needs the tags
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.25"

      - name: test
        run: |
          go vet ./...
          go test ./...

      - name: build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          OUT: dist/aval-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
        run: |
          version="$(git describe --tags --always)"
          # -trimpath keeps absolute build paths out of the binary; -s -w drops
          # the symbol table, which roughly halves the download.
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "$OUT" ./cmd/aval

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aval-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        run: |
          cd dist
          sha256sum aval-* > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/aval-*

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes --title "$TAG"
