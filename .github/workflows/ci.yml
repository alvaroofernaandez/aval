# Tests on every push to main and every pull request. Read-only token, no
# secrets, GitHub-owned actions pinned by commit SHA (tests/workflows_test.go
# enforces all of it). Fork pull requests need the owner's approval to run.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: gitleaks scans every commit, and the pre-push test
          # pushes from a clone (a shallow one is rejected by git).
          fetch-depth: 0

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.25"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Tools the integration tests drive; every Go test skips cleanly without
      # them. Versions are pinned: nothing "latest" runs in CI.
      - name: install test tools (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmux zsh nano ncurses-term
          sudo locale-gen es_ES.UTF-8
      - name: install test tools (macos)
        if: runner.os == 'macOS'
        run: brew install tmux
      # Windows has no tmux or zsh: the suites that need them skip there with
      # a reason (testenv.SkipWindows). Git for Windows provides bash and sh.
      - name: install gitleaks
        shell: bash
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Windows installs in copy mode (--copy): the same path a user without
      # symlink rights takes, instead of whatever the runner's privileges allow.
      - name: install aval
        shell: bash
        run: |
          ext=""; copy=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; copy="--copy"; fi
          mkdir -p "$HOME/.local/bin"
          go build -o "$HOME/.local/bin/aval$ext" ./cmd/aval
          "$HOME/.local/bin/aval$ext" --yes $copy

      - name: go vet
        run: go vet ./...
      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: go test
        if: runner.os != 'Windows'
        timeout-minutes: 10
        run: go test ./... -race
      # -race needs cgo and a C toolchain, which a Windows runner does not
      # reliably provide; Linux and macOS keep the race detector.
      - name: go test (windows)
        if: runner.os == 'Windows'
        timeout-minutes: 15
        run: go test ./...
      - name: npm tests
        shell: bash
        run: node --test npm/cli/lib/*.test.js
