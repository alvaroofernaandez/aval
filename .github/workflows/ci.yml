# Tests on every push to main and every pull request. Read-only token, no
# secrets, GitHub-owned actions pinned by commit SHA (tests/workflows_test.go
# enforces all of it). Fork pull requests need the owner's approval to run.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: gitleaks scans every commit, and the pre-push test
          # pushes from a clone (a shallow one is rejected by git).
          fetch-depth: 0

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.25"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Tools the integration tests drive; every Go test skips cleanly without
      # them. Versions are pinned: nothing "latest" runs in CI.
      - name: install test tools (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmux zsh nano ncurses-term
          sudo locale-gen es_ES.UTF-8
      - name: install test tools (macos)
        if: runner.os == 'macOS'
        run: brew install tmux
      # Windows has no tmux or zsh: the suites that need them skip there with
      # a reason (testenv.SkipWindows). Git for Windows provides bash and sh.
      # bun runs the OpenCode plugin probes (tests/opencode_gate_test.go,
      # tests/rateguard_test.go), which skip without it. Installed from npm
      # at an exact version: nothing "latest" runs in CI.
      - name: install bun
        shell: bash
        run: npm install -g bun@1.3.14
      # gitleaks and actionlint are tools of the table; the versions here are
      # the table's pins (tests/workflows_test.go compares them).
      - name: install gitleaks and actionlint
        shell: bash
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Windows installs in copy mode (--copy): the same path a user without
      # symlink rights takes, instead of whatever the runner's privileges allow.
      - name: install aval
        shell: bash
        run: |
          ext=""; copy=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; copy="--copy"; fi
          mkdir -p "$HOME/.local/bin"
          go build -o "$HOME/.local/bin/aval$ext" ./cmd/aval
          "$HOME/.local/bin/aval$ext" --yes $copy

      # Every quality step (gofmt, vet, tests, npm tests, actionlint, agents
      # lint, gitleaks) is a row of the table in internal/devmode/check, with its
      # per-OS rules (no -race on Windows). Nothing is repeated here, so CI and
      # `aval dev check` on a laptop cannot disagree; tests/workflows_test.go
      # fails if a quality command appears in this file.
      - name: aval dev check
        shell: bash
        timeout-minutes: 20
        run: |
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          "$HOME/.local/bin/aval$ext" dev check

  # A short fuzzing pass per fuzz target (#45). A finding turns CI red, which
  # blocks releases; the corpus it wrote is kept as an artifact to reproduce it.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.25"
      - name: fuzz FuzzLessonMatch
        run: go test ./internal/agent/lessons -run '^$' -fuzz '^FuzzLessonMatch$' -fuzztime=20s
      - name: fuzz FuzzLessonBody
        run: go test ./internal/agent/lessons -run '^$' -fuzz '^FuzzLessonBody$' -fuzztime=20s
      - name: fuzz FuzzPlanGatePath
        run: go test ./internal/deck -run '^$' -fuzz '^FuzzPlanGatePath$' -fuzztime=20s
      - name: fuzz FuzzHookInput
        run: go test ./cmd/aval -run '^$' -fuzz '^FuzzHookInput$' -fuzztime=20s
      - name: fuzz FuzzRelayCompactInput
        run: go test ./cmd/aval -run '^$' -fuzz '^FuzzRelayCompactInput$' -fuzztime=20s
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fuzz-corpus
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore
