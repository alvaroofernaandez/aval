# Keeps dependencies current: Dependabot opens one weekly PR per ecosystem
# (SHA-pinned GitHub Actions, Go modules, npm); CI runs on it before merge.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /npm/cli
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
